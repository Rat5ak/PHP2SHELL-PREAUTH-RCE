name: phpmyadmin-functional-stock

services:
  db:
    image: mariadb:11@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    container_name: p2s-phpmyadmin-functional-db
    environment:
      MARIADB_ROOT_PASSWORD: p2s-root
      MARIADB_DATABASE: p2s
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30

  phpmyadmin:
    build: .
    container_name: p2s-phpmyadmin-functional-stock
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18212:80"
